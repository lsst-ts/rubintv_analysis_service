---
locations:
  dev:
    users_path: /sdf/home/f/fred3m/u/data/dev_users
    consdb: usdf-summitdb-logical-replica-svc.sdf.slac.stanford.edu
    butlers:
      - embargo
    # efd_url: connection info here
  summit:
    users_path: /var/ddv-config
    credentials_path: /etc/secrets/postgres-credentials.txt
    consdb: postgresdb01.cp.lsst.org
    butlers:
      - embargo
    # efd_url: connection info here
  base:
    users_path: /var/ddv-config
    credentials_path: /etc/secrets/postgres-credentials.txt
    consdb: postgresdb01.ls.lsst.org
    butlers:
      - LSSTCam
    # efd_url: connection info here
  usdf:
    users_path: /var/ddv-config
    credentials_path: /etc/secrets/postgres-credentials.txt
    consdb: usdf-summitdb-logical-replica-svc.sdf.slac.stanford.edu
    butlers:
      - embargo
    # efd_url: connection info here
# The lsst-sdm-schemas release the schema files below are read from. One is
# published per science-pipelines weekly (30.2026.3700 is w_2026_37); bump it
# here to pick up ConsDB schema changes. The container's own stack copy is
# ignored, so the worker sees the same tables at every site.
sdm_schemas_version: "30.2026.3700"
schemas:
  cdb_latiss: cdb_latiss.yaml
  cdb_lsstcomcam: cdb_lsstcomcam.yaml
  cdb_lsstcomcamsim: cdb_lsstcomcamsim.yaml
  cdb_lsstcam: cdb_lsstcam.yaml
# The transformed EFD tables (exposure_efd and visit1_efd) live in their own
# efd_<instrument> Postgres schemas and are served as part of the instrument's
# ConsDB schema above. Their schema files are read from the lsst-dm/consdb
# repository, whose transformed EFD service generates the tables from them;
# lsst-sdm-schemas carries copies too, but those are synced by hand and have
# lagged the database by over a hundred columns. This is the consdb git tag
# the files are fetched from (https://github.com/lsst-dm/consdb/tags); bump it
# to pick up new EFD columns. The tables are only populated at USDF.
consdb_version: "26.9.1"
efd_schemas:
  cdb_latiss: efd_latiss.yaml
  cdb_lsstcomcam: efd_lsstcomcam.yaml
  cdb_lsstcam: efd_lsstcam.yaml
